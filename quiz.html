/* Agent Arena - styles. Chunky "game card" look: thick outlines, hard shadows, five level colours. */
:root{

  --yes:#1F9D61; --yes-bg:#DDF5E8; --no:#D43D3D; --no-bg:#FCE4E4;
  --l1:#FF6B4A; --l2:#2F6FED; --l3:#9B5DE5; --l4:#1F9D61; --l5:#E0A100;
  --shadow:4px 4px 0 var(--edge);
  --head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --text:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0E1F1D; --card:#17302C; --soft:#1D3A35; --ink:#E8F5F2; --dim:#9DBBB5; --edge:#04100E;
    --hot:#FF8466; --hot-ink:#2B0D05; --sun:#FFD95C; --sky:#6C9BFF; --sky-ink:#081430;
    --yes:#5BD79A; --yes-bg:#143826; --no:#FF8A8A; --no-bg:#401A1A;
    --l1:#FF8466; --l2:#6C9BFF; --l3:#BC8CFF; --l4:#5BD79A; --l5:#FFCB47;
    color-scheme:dark;
  }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}
p{margin:0}
.shell{max-width:860px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--head);font-weight:800;font-size:26px}
.logo-bot{width:34px;height:28px;border:3px solid var(--edge);border-radius:8px;background:var(--sun);display:flex;justify-content:center;align-items:center;gap:6px}
.logo-bot i{width:6px;height:6px;border-radius:50%;background:var(--edge)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{background:var(--card);border:2px solid var(--edge);border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--edge);color:var(--page)}
.foot{font-size:13px;color:var(--dim);text-align:center}
.card{background:var(--card);border:3px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);padding:22px}
.col{display:flex;flex-direction:column;gap:16px}
.line{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dim{color:var(--dim)}
.num{font-family:var(--code);font-variant-numeric:tabular-nums}
.go{background:var(--hot);color:var(--hot-ink);border:3px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);padding:10px 24px;font-family:var(--head);font-weight:700;font-size:20px}
.go:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.alt{background:var(--card);color:var(--ink)}
.go.sm{font-size:16px;padding:6px 16px;box-shadow:3px 3px 0 var(--edge)}

/* start */
.title{font-size:clamp(36px,8vw,62px);font-weight:800}
.title em{font-style:normal;color:var(--hot)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:740px){.split{grid-template-columns:minmax(0,1fr)}}
label.cap,.cap{font-weight:700;font-size:15px;display:block;margin-bottom:6px}
input[type=text]{width:100%;background:var(--soft);border:2px solid var(--edge);border-radius:10px;padding:10px 12px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{background:var(--soft);border:2px solid var(--edge);border-radius:10px;padding:8px 12px;text-align:left;min-width:0}
.pick button b{display:block;font-family:var(--head);font-size:17px;line-height:1.2}
.pick button small{color:var(--dim);font-size:13px}
.pick button.on{background:var(--sun);color:#2B2100}
.pick button.on small{color:#4d3d00}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;gap:10px;align-items:flex-start}
.chip{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;font-family:var(--head);font-weight:800;color:#fff}
.c1{background:var(--l1)}.c2{background:var(--l2)}.c3{background:var(--l3)}.c4{background:var(--l4)}.c5{background:var(--l5)}
.ladder b{font-family:var(--head)}
.ladder span{display:block;font-size:14px;color:var(--dim)}

/* play */
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.hud>div{background:var(--card);border:2px solid var(--edge);border-radius:10px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.hud small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hud b{font-family:var(--code);font-size:19px}
.hearts{letter-spacing:2px;color:var(--no)}
.hearts .lost{opacity:.25}
.clock{margin-left:auto;flex-direction:row!important;align-items:center;gap:10px}
.ring{--p:100;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--sky) calc(var(--p)*1%),var(--soft) 0);border:2px solid var(--edge);display:grid;place-items:center}
.ring::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--edge)}
.ring.low{background:conic-gradient(var(--no) calc(var(--p)*1%),var(--soft) 0)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps div{height:14px;border:2px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden}
.steps i{display:block;height:100%;width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--code);font-size:12px;border:2px solid var(--edge);border-radius:999px;padding:1px 9px;background:var(--soft)}
.pill.kind{color:#fff}
.ask{font-size:20px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.fig{font-family:var(--code);font-size:15px;white-space:pre;background:var(--soft);border:2px dashed var(--edge);border-radius:10px;padding:10px 14px;overflow-x:auto}
.ar p{margin-bottom:6px}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--soft);border:2px solid var(--edge);border-radius:12px;padding:10px 12px}
.choice .key{flex:none;font-family:var(--head);font-weight:800;width:28px;height:28px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;background:var(--card)}
.choice span:last-child{min-width:0;overflow-wrap:anywhere}
.choice:hover:not(:disabled){background:var(--card)}
.choice.on{background:var(--sun);color:#2B2100}
.choice.good{background:var(--yes-bg);border-color:var(--yes)}
.choice.good .key{background:var(--yes);color:#fff;border-color:var(--yes)}
.choice.bad{background:var(--no-bg);border-color:var(--no)}
.choice.out{opacity:.3;text-decoration:line-through}
.choice:disabled{cursor:default}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px 16px}
.pairs .side{display:flex;flex-direction:column;gap:8px}
@media (max-width:560px){.pairs{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--soft);border:2px solid var(--edge);border-radius:10px;padding:8px 10px;min-height:44px}
.tile.on{background:var(--sun);color:#2B2100}
.tile .tag{flex:none;font-family:var(--code);font-weight:700;font-size:13px;min-width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--sky);color:var(--sky-ink)}
.tile.good{border-color:var(--yes);background:var(--yes-bg)}.tile.bad{border-color:var(--no);background:var(--no-bg)}
.power{display:flex;flex-wrap:wrap;gap:8px}
.power button{background:var(--card);border:2px dashed var(--edge);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.power button:disabled{opacity:.4;cursor:not-allowed}
.power button.armed{background:var(--sky);color:var(--sky-ink);border-style:solid}
.clue{background:var(--soft);border-left:6px solid var(--sun);border-radius:6px;padding:8px 12px}
.verdict{border:3px solid var(--edge);border-radius:12px;padding:12px 16px}
.verdict.good{background:var(--yes-bg);border-color:var(--yes)}
.verdict.bad{background:var(--no-bg);border-color:var(--no)}
.verdict h3{font-size:22px;margin-bottom:4px}
.banner{color:#fff;border-radius:12px;border:3px solid var(--edge);padding:20px}
.banner h2{font-size:34px}
.banner p{opacity:.95}

/* end */
.stars{font-size:40px;letter-spacing:6px;color:var(--sun);-webkit-text-stroke:2px var(--edge)}
.stars .off{color:var(--soft)}
.huge{font-family:var(--head);font-weight:800;font-size:clamp(52px,12vw,88px);line-height:.9}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--sun);color:#2B2100;border:2px solid var(--edge);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--soft);white-space:nowrap}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
td.r,th.r{text-align:right;font-family:var(--code)}
tr.me td{background:var(--soft);font-weight:700}
.meter{display:inline-block;width:110px;height:12px;border:2px solid var(--edge);border-radius:999px;overflow:hidden;vertical-align:middle;background:var(--card)}
.meter i{display:block;height:100%}
.rev{border-top:2px solid var(--soft);padding:12px 0;display:flex;flex-direction:column;gap:5px}
.key-ans{background:var(--yes-bg);border-left:6px solid var(--yes);border-radius:6px;padding:6px 12px}
.ok{color:var(--yes);font-weight:700}.ko{color:var(--no);font-weight:700}
.empty{border:3px dashed var(--edge);border-radius:14px;padding:26px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
</style>

// Agent Arena - game logic.
// The quiz is a ladder of 5 levels. Every screen is built as an HTML string and
// buttons carry a data-act attribute that one click listener dispatches on.

const LEVELS = BANK.levels, ALL = BANK.questions, AR_OPTIONS = BANK.arOptions;
const KIND = { mcq: "MCQ", truefalse: "True / False", assertion: "Assertion-Reason", blank: "Fill in the blank",
               match: "Match the following", scenario: "Scenario", problem: "Problem solving" };
const RANKS = { rookie: { name: "Rookie", secs: 45, mult: 1 }, pro: { name: "Pro", secs: 30, mult: 1.5 }, expert: { name: "Expert", secs: 20, mult: 2 } };
const LENGTHS = { 2: "Sprint", 4: "Classic", 10: "Marathon" };
const RULES = { base: 100, perSecond: 2, clueCost: 30, comboStep: 10, comboCap: 5, lives: 3, freeze: 15 };
const view = document.getElementById("view");

/* ---------- utilities ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mix = list => { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tidy = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
const clock = s => `${Math.floor(s / 60)}:${String(Math.round(s) % 60).padStart(2, "0")}`;
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };

/* ---------- game state ---------- */
const setup = Object.assign({ name: "", perLevel: 4, rank: "rookie", mode: "challenge" }, load("arena_setup", {}));
let screen = "start", game = null, ticker = null, startedAt = 0, extra = 0, bankOpen = false, fameFilter = "all";

/* ---------- building a game ---------- */
function drawLevel(level, count) {
  // prefer different topics inside a level, then fill up with whatever is left
  const pool = mix(ALL.filter(q => q.level === level)), seen = new Set(), first = [], rest = [];
  for (const q of pool) (seen.has(q.topic) ? rest : (seen.add(q.topic), first)).push(q);
  return mix([...first, ...rest].slice(0, count));
}
function wrap(q) {
  const turn = { q, state: "open", pick: null, clue: false, gone: [], points: 0, secs: 0, shielded: false };
  if (q.options) turn.order = mix(q.options.map((_, i) => i));
  if (q.kind === "assertion") turn.order = [0, 1, 2, 3];
  if (q.kind === "match") { turn.right = mix(q.pairs.map(p => p[1])); turn.links = {}; turn.hand = null; }
  if (q.kind === "blank") turn.pick = "";
  return turn;
}
function newGame() {
  const turns = [];
  for (const lv of LEVELS) turns.push(...drawLevel(lv.n, setup.perLevel).map(wrap));
  game = { turns, at: 0, score: 0, combo: 0, bestCombo: 0, lives: RULES.lives, cfg: { ...setup },
           power: { freeze: 2, zap: 2, shield: 1 }, usedPower: false, armed: false, over: false, intro: 1 };
  screen = "intro"; paint();
}
const turn = () => game.turns[game.at];
const timed = () => game.cfg.mode === "challenge";
const limit = t => RANKS[game.cfg.rank].secs + (t.q.kind === "match" || t.q.kind === "problem" ? 15 : 0);

/* ---------- checking and scoring ---------- */
function ready(t) {
  if (t.q.kind === "blank") return tidy(t.pick) !== "";
  if (t.q.kind === "match") return Object.keys(t.links).length === t.q.pairs.length;
  return t.pick !== null;
}
function correct(q, t) {
  if (q.kind === "blank") return q.accept.map(tidy).includes(tidy(t.pick));
  if (q.kind === "match") return q.pairs.every((p, i) => t.links[i] === p[1]);
  return t.pick === q.answer;
}
function rightAnswer(q) {
  if (q.kind === "truefalse") return q.answer ? "True" : "False";
  if (q.kind === "assertion") return AR_OPTIONS[q.answer];
  if (q.kind === "blank") return q.accept[0];
  if (q.kind === "match") return q.pairs.map(p => `${p[0]} = ${p[1]}`).join("; ");
  return q.options[q.answer];
}
function settle(t, secsUsed, timeout) {
  const total = limit(t);
  t.secs = Math.min(secsUsed, total + extra);
  const good = !timeout && correct(t.q, t);
  if (good) {
    game.combo++; game.bestCombo = Math.max(game.bestCombo, game.combo);
    const base = Math.round(RULES.base * RANKS[game.cfg.rank].mult);
    const speed = timed() ? Math.max(0, Math.floor(total + extra - secsUsed)) * RULES.perSecond : 0;
    const combo = game.combo >= 2 ? RULES.comboStep * Math.min(game.combo, RULES.comboCap) : 0;
    t.points = Math.max(0, base + speed + combo - (t.clue ? RULES.clueCost : 0));
    t.parts = { base, speed, combo };
    game.score += t.points; t.state = "right";
  } else {
    game.combo = 0; t.state = timeout ? "late" : "wrong";
    if (timed()) { if (game.armed) { t.shielded = true; } else game.lives--; }
  }
  game.armed = false;
  if (timed() && game.lives <= 0) game.over = true;
}
function summary(g) {
  const done = g.turns.filter(t => t.state !== "open");
  const right = done.filter(t => t.state === "right").length;
  const perLevel = LEVELS.map(lv => { const ts = g.turns.filter(t => t.q.level === lv.n); return { lv, right: ts.filter(t => t.state === "right").length, total: ts.length, done: ts.filter(t => t.state !== "open").length }; });
  const acc = Math.round(100 * right / g.turns.length);
  const secs = Math.round(done.reduce((s, t) => s + t.secs, 0));
  const badges = [];
  if (perLevel.some(l => l.done === l.total && l.right === l.total)) badges.push("Flawless level");
  if (g.bestCombo >= 5) badges.push("Combo x5");
  if (!g.usedPower && done.length === g.turns.length) badges.push("No power-ups");
  if (timed() && !g.over && g.lives === RULES.lives) badges.push("Untouched");
  if (timed() && done.length && secs / done.length < 12 && acc >= 60) badges.push("Quick thinker");
  const title = acc >= 85 ? "Utility Maximiser" : acc >= 60 ? "Goal-Based Agent" : acc >= 40 ? "Model-Based Agent" : "Simple Reflex Agent";
  return { right, total: g.turns.length, answered: done.length, acc, secs, perLevel, badges, title, stars: acc >= 85 ? 3 : acc >= 60 ? 2 : acc >= 40 ? 1 : 0 };
}

/* ---------- timer ---------- */
const secsLeft = t => Math.max(0, limit(t) + extra - (Date.now() - startedAt) / 1000);
function stopClock() { clearInterval(ticker); ticker = null; }
function runClock() {
  stopClock(); startedAt = Date.now(); extra = 0;
  if (!timed()) return;
  ticker = setInterval(() => {
    const t = turn(); if (!t || t.state !== "open") return stopClock();
    const total = limit(t) + extra, left = total - (Date.now() - startedAt) / 1000;
    const ring = document.getElementById("ring"), txt = document.getElementById("left");
    if (ring) { ring.style.setProperty("--p", Math.max(0, 100 * left / total)); ring.classList.toggle("low", left <= 8); }
    if (txt) txt.textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) lockIn(true);
  }, 200);
}
function lockIn(timeout) {
  const t = turn(); if (t.state !== "open" || (!timeout && !ready(t))) return;
  stopClock(); settle(t, (Date.now() - startedAt) / 1000, timeout); paint();
  document.getElementById("onward")?.focus();
}
function onward() {
  const t = turn(), last = game.at === game.turns.length - 1;
  if (game.over || last) return finish();
  const next = game.turns[game.at + 1];
  game.at++;
  if (next.q.level !== t.q.level) { game.intro = next.q.level; screen = "intro"; paint(); }
  else { runClock(); paint(); }
  window.scrollTo(0, 0);
}
function finish() {
  stopClock();
  const s = summary(game);
  game.entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: (game.cfg.name || "").trim().slice(0, 20) || "Anonymous agent",
    score: game.score, acc: s.acc, right: s.right, total: s.total, rank: game.cfg.rank, mode: game.cfg.mode, len: game.cfg.perLevel, secs: s.secs, when: Date.now(), cleared: !game.over };
  save("arena_scores", [...load("arena_scores", []), game.entry].slice(-150));
  screen = "end"; paint(); window.scrollTo(0, 0);
}

/* ---------- screens ---------- */

}
function playScreen() {

    ${rows.length ? `<div class="card scroll"><table><thead><tr><th class="r">#</th><th>Agent</th><th class="r">Score</th><th class="r">Accuracy</th><th>Game</th><th class="r">Time</th><th>Date</th></tr></thead><tbody>
      ${rows.map((e, i) => `<tr class="${e.id === mine ? "me" : ""}"><td class="r">${i + 1}</td><td>${esc(String(e.name).slice(0, 20))}</td><td class="r">${+e.score || 0}</td><td class="r">${+e.acc || 0}%</td>
        <td>${LENGTHS[e.len] || ""} · ${RANKS[e.rank]?.name || ""} · ${e.mode === "practice" ? "practice" : e.cleared ? "cleared" : "knocked out"}</td><td class="r">${clock(+e.secs || 0)}</td><td>${new Date(e.when).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><b>No scores yet.</b> Finish a game and your agent's name, score and accuracy will be listed here.<div style="margin-top:12px"><button class="go sm" data-act="go" data-to="start">Play now</button></div></div>`}</section>`;
}
function bankScreen() {
  const body = LEVELS.map(lv => `<div class="card col"><div class="line"><span class="chip c${lv.n}">${lv.n}</span><h2 style="font-size:22px">${esc(lv.name)}</h2></div>
    ${ALL.filter(q => q.level === lv.n).map(q => `<div class="rev"><div class="line"><span class="num">${q.id}</span><span class="pill">${KIND[q.kind]}</span><span class="pill">${esc(q.topic)}</span></div>
      ${q.kind === "assertion" ? `<div><b>A:</b> ${esc(q.assertion)}<br><b>R:</b> ${esc(q.reason)}</div>` : `<div style="font-weight:700">${esc(q.text)}</div>`}
      ${q.figure ? `<div class="fig">${esc(q.figure)}</div>` : ""}
      ${q.options ? `<div>${q.options.map((o, i) => `${"ABCD"[i]}. ${esc(o)}`).join("<br>")}</div>` : ""}
      ${q.kind === "match" ? `<div class="dim">Items: ${q.pairs.map(p => esc(p[0])).join(", ")}</div>` : ""}
      ${bankOpen ? `<div class="key-ans"><b>Answer:</b> ${q.options ? "ABCD"[q.answer] + ". " : ""}${esc(rightAnswer(q))}<br>${esc(q.why)}</div>` : ""}</div>`).join("")}</div>`).join("");
  return `<section class="col"><h1 style="font-size:40px">Question bank</h1>
    <div class="line"><p class="dim">${ALL.length} questions across ${LEVELS.length} levels.</p><button class="go alt sm" id="reveal" data-act="reveal">${bankOpen ? "Hide answers" : "Show answers"}</button></div>${body}</section>`;
}
function rulesScreen() {
  const n = f => ALL.filter(f).length;
  return `<section class="col"><h1 style="font-size:40px">Rules</h1>
    <div class="card col"><h2 style="font-size:22px">How to play</h2><ul class="plain">
      <li>The game has five levels. Each game picks fresh random questions for every level, and the answer options are shuffled.</li>
      <li><b>Challenge mode:</b> every question is timed and you have ${RULES.lives} lives. A wrong answer or a time-out costs one life. At zero lives the game ends.</li>
      <li><b>Practice mode:</b> no timer and no lives, for revision.</li>
      <li><b>Difficulty:</b> Rookie gives 45 seconds, Pro 30 and Expert 20. Harder ranks multiply points by 1.5 and 2. Matching and problem-solving questions get 15 seconds more.</li>
      <li><b>Points:</b> ${RULES.base} x difficulty for a correct answer, plus ${RULES.perSecond} for every second left, plus a combo bonus of 10 x your streak (from 2 in a row, up to 50).</li>
      <li><b>Power-ups:</b> Clue shows a hint for ${RULES.clueCost} points. Zap removes one wrong option (2 per game). +${RULES.freeze}s adds time (2 per game). Shield protects one life if your next answer is wrong (1 per game).</li>
      <li>After every answer you see the correct answer and why. The end screen gives stars, a rank title, badges and a level-by-level table.</li></ul></div>
    <div class="card col"><h2 style="font-size:22px">What is in the bank</h2>
      <p>${ALL.length} questions on ${new Set(ALL.map(q => q.topic)).size} topics. ${n(q => q.real)} use real-world situations and ${n(q => q.search)} are search or state-space problems.</p>
      <div class="scroll"><table><thead><tr><th>Format</th><th class="r">Questions</th></tr></thead><tbody>${Object.entries(KIND).map(([k, v]) => `<tr><td>${v}</td><td class="r">${n(q => q.kind === k)}</td></tr>`).join("")}</tbody></table></div></div></section>`;
}
function paint() {
  const screens = { start: startScreen, intro: introScreen, play: playScreen, end: endScreen, fame: fameScreen, bank: bankScreen, rules: rulesScreen };
  view.innerHTML = screens[screen]();
  const tabFor = ["intro", "play", "end"].includes(screen) ? "start" : screen;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.to === tabFor));
}

/* ---------- one listener for every button ---------- */
const actions = {
  go(b) { stopClock(); screen = b.dataset.to; paint(); window.scrollTo(0, 0); },
  set(b) { const k = b.dataset.key, v = b.dataset.val; setup[k] = k === "perLevel" ? +v : v; save("arena_setup", setup); paint(); },
  new() { newGame(); window.scrollTo(0, 0); },
  level() { screen = "play"; runClock(); paint(); window.scrollTo(0, 0); },
  pick(b) { const t = turn(), n = +b.dataset.n; t.pick = t.q.kind === "truefalse" ? n === 0 : t.order[n]; paint(); document.getElementById("lock")?.focus(); },
  left(b) { const t = turn(), i = +b.dataset.i; if (t.hand === i) t.hand = null; else { t.hand = i; delete t.links[i]; } paint(); },
  right(b) { const t = turn(), r = t.right[+b.dataset.j]; if (t.hand === null) return;
    for (const k of Object.keys(t.links)) if (t.links[k] === r) delete t.links[k];
    t.links[t.hand] = r; t.hand = null; paint(); },
  lock() { lockIn(false); },
  onward() { onward(); },
  clue() { const t = turn(); if (!t.clue) { t.clue = true; game.usedPower = true; paint(); } },
  zap() { const t = turn(), q = t.q; if (!game.power.zap || t.gone.length >= 2) return;
    const wrong = mix([0, 1, 2, 3].filter(i => i !== q.answer && !t.gone.includes(i)))[0];
    t.gone.push(wrong); if (t.pick === wrong) t.pick = null; game.power.zap--; game.usedPower = true; paint(); },
  freeze() { if (!game.power.freeze) return; game.power.freeze--; extra += RULES.freeze; game.usedPower = true; paint(); },
  shield() { if (game.armed) { game.armed = false; game.power.shield++; } else if (game.power.shield) { game.armed = true; game.power.shield--; game.usedPower = true; } paint(); },
  reveal() { bankOpen = !bankOpen; paint(); },
  fame(b) { fameFilter = b.dataset.val; paint(); },
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && !b.disabled) actions[b.dataset.act](b); });
document.addEventListener("input", e => {
  if (e.target.id === "who") { setup.name = e.target.value; save("arena_setup", setup); }
  if (e.target.id === "gap") { turn().pick = e.target.value; document.getElementById("lock").disabled = !ready(turn()); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "gap") lockIn(false); });

window.arena = { get game() { return game; }, RANKS, summary };
paint();
</script>

</body></html>
